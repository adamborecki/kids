<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">A chunky four-color click pen: black, blue, red and green</title>
  <defs>
    <linearGradient id="barrel" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="231" rx="90" ry="6" fill="#1f2a44" opacity=".1"/>
  <!-- scribbles in all four colors -->
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 70q10-14 20 0t20 0t20 0" stroke="#1f2a44"/>
    <path d="M14 96q10-14 20 0t20 0t20 0" stroke="#2563eb"/>
    <path d="M14 122q10-14 20 0t20 0t20 0" stroke="#16a34a"/>
    <path d="M18 212c10-30 34-30 30-6s-22 14-10-6 34-24 40 8" stroke="#ef4444"/>
  </g>
  <g transform="rotate(25 120 130)">
    <!-- sliders -->
    <rect x="97" y="26" width="10" height="44" rx="3" fill="#1f2a44"/>
    <rect x="109" y="26" width="10" height="44" rx="3" fill="#2563eb"/>
    <rect x="121" y="46" width="10" height="24" rx="3" fill="#ef4444"/>
    <rect x="133" y="26" width="10" height="44" rx="3" fill="#16a34a"/>
    <!-- barrel -->
    <rect x="92" y="58" width="56" height="134" rx="16" fill="url(#barrel)" stroke="#94a3b8" stroke-width="3"/>
    <rect x="92" y="58" width="56" height="20" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <!-- color windows -->
    <rect x="99" y="86" width="9" height="30" rx="4" fill="#1f2a44"/>
    <rect x="111" y="86" width="9" height="30" rx="4" fill="#2563eb"/>
    <rect x="123" y="86" width="9" height="30" rx="4" fill="#ef4444"/>
    <rect x="135" y="86" width="9" height="30" rx="4" fill="#16a34a"/>
    <!-- clip -->
    <rect x="146" y="62" width="11" height="70" rx="5.5" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <!-- grip -->
    <rect x="94" y="148" width="52" height="42" fill="#e2e8f0"/>
    <path d="M100 152v34M108 152v34M116 152v34M124 152v34M132 152v34M140 152v34" stroke="#cbd5e1" stroke-width="3"/>
    <!-- tip -->
    <path d="M97 190H143L125 222H115Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M115 222H125L120 233Z" fill="#ef4444"/>
    <path d="M100 66V182" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  </g>
  <text x="176" y="42" font-family="Fredoka, Arial, sans-serif" font-weight="700" font-size="20" fill="#ef4444" transform="rotate(12 176 42)">click!</text>
</svg>
