<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">A label maker next to a stack of tape, with one magic silver tape on top</title>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".3" stop-color="#b8c2d0"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#8e9bb0"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3a8" stop-opacity="0"/>
    </radialGradient>
    <path id="spark" d="M0-10L2.6-2.6L10 0L2.6 2.6L0 10L-2.6 2.6L-10 0L-2.6-2.6Z"/>
  </defs>
  <ellipse cx="120" cy="231" rx="104" ry="6" fill="#1f2a44" opacity=".1"/>

  <!-- tape stack (practice tapes) -->
  <g stroke-width="2.5">
    <rect x="152" y="202" width="72" height="24" rx="7" fill="#e5e7eb" stroke="#a3abb8"/>
    <rect x="156" y="178" width="70" height="24" rx="7" fill="#fde68a" stroke="#c9a33a"/>
    <rect x="150" y="154" width="72" height="24" rx="7" fill="#bfdbfe" stroke="#7aa2d6"/>
    <rect x="155" y="130" width="70" height="24" rx="7" fill="#fbcfe8" stroke="#cf8db0"/>
  </g>
  <g fill="#fff" opacity=".85">
    <circle cx="170" cy="214" r="6"/><circle cx="174" cy="190" r="6"/><circle cx="168" cy="166" r="6"/><circle cx="173" cy="142" r="6"/>
  </g>
  <g fill="#1f2a44" opacity=".18">
    <rect x="186" y="210" width="28" height="8" rx="3"/><rect x="190" y="186" width="28" height="8" rx="3"/>
    <rect x="184" y="162" width="28" height="8" rx="3"/><rect x="189" y="138" width="28" height="8" rx="3"/>
  </g>

  <!-- the ONE magic silver tape -->
  <circle cx="190" cy="112" r="40" fill="url(#glow)"/>
  <g transform="rotate(-8 190 112)">
    <rect x="154" y="99" width="74" height="27" rx="8" fill="url(#silver)" stroke="#7c879a" stroke-width="2.5"/>
    <circle cx="171" cy="112.5" r="6.5" fill="#fff" stroke="#7c879a" stroke-width="2"/>
    <text x="203" y="117" font-family="Fredoka, Arial, sans-serif" font-weight="700" font-size="11" fill="#475569" text-anchor="middle">MAGIC</text>
  </g>
  <g fill="#ffd23f">
    <use href="#spark" transform="translate(160 86) scale(.9)"/>
    <use href="#spark" transform="translate(226 90) scale(.7)"/>
    <use href="#spark" transform="translate(232 124) scale(.5)"/>
  </g>
  <use href="#spark" transform="translate(196 80) scale(.55)" fill="#fff" stroke="#ffd23f" stroke-width="2"/>

  <!-- label maker -->
  <g transform="rotate(-6 88 140)">
    <rect x="58" y="22" width="60" height="30" rx="4" fill="url(#silver)" stroke="#7c879a" stroke-width="2.5"/>
    <text x="88" y="42" font-family="Fredoka, Arial, sans-serif" font-weight="700" font-size="12" fill="#334155" text-anchor="middle">✨ WOW</text>
    <rect x="30" y="46" width="116" height="176" rx="26" fill="#ffcf33" stroke="#d29a00" stroke-width="3"/>
    <rect x="66" y="44" width="44" height="8" rx="3" fill="#1f2a44"/>
    <rect x="44" y="64" width="88" height="34" rx="8" fill="#1e3a2f" stroke="#d29a00" stroke-width="2.5"/>
    <text x="88" y="87" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="15" fill="#7cffb2" text-anchor="middle">WOW_</text>
    <g fill="#fff" stroke="#d29a00" stroke-width="1.8">
      <rect x="44" y="110" width="14" height="12" rx="3"/><rect x="62" y="110" width="14" height="12" rx="3"/><rect x="80" y="110" width="14" height="12" rx="3"/><rect x="98" y="110" width="14" height="12" rx="3"/><rect x="116" y="110" width="14" height="12" rx="3"/>
      <rect x="44" y="127" width="14" height="12" rx="3"/><rect x="62" y="127" width="14" height="12" rx="3"/><rect x="80" y="127" width="14" height="12" rx="3"/><rect x="98" y="127" width="14" height="12" rx="3"/><rect x="116" y="127" width="14" height="12" rx="3"/>
      <rect x="44" y="144" width="14" height="12" rx="3"/><rect x="62" y="144" width="14" height="12" rx="3"/><rect x="80" y="144" width="14" height="12" rx="3"/><rect x="98" y="144" width="14" height="12" rx="3"/><rect x="116" y="144" width="14" height="12" rx="3"/>
      <rect x="44" y="161" width="14" height="12" rx="3"/><rect x="62" y="161" width="50" height="12" rx="3"/><rect x="116" y="161" width="14" height="12" rx="3"/>
    </g>
    <circle cx="88" cy="196" r="13" fill="#ff5c8a" stroke="#c23b66" stroke-width="2.5"/>
    <circle cx="84" cy="192" r="4" fill="#fff" opacity=".6"/>
  </g>
</svg>
