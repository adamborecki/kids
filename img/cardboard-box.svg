  <!-- back flaps -->
  <path d="M38 118L120 78L100 34L18 74Z" fill="#d9a066" stroke="#7a4a1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 78L202 118L222 74L140 34Z" fill="#c78a4e" stroke="#7a4a1f" stroke-width="3" stroke-linejoin="round"/>
